services:

  # ==============================================================================
  # INFRAESTRUCTURA DE PERSISTENCIA (2 INSTANCIAS POSTGRESQL 16)
  # ==============================================================================

  # 1. postgres-core: Camino Crítico de Dinero (authdb, userdb, transactiondb)
  postgres-core:
    image: postgres:16-alpine
    container_name: fintech-postgres-core
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: authdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
      - ./infra/postgres/init-core.sql:/docker-entrypoint-initdb.d/init-core.sql:ro,z
    command: >
      postgres -c max_connections=150
               -c shared_buffers=128MB
               -c work_mem=8MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. postgres-support: Servicios de Soporte (notificationdb, workerdb)
  postgres-support:
    image: postgres:16-alpine
    container_name: fintech-postgres-support
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: notificationdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres-support-data:/var/lib/postgresql/data
      - ./infra/postgres/init-support.sql:/docker-entrypoint-initdb.d/init-support.sql:ro,z
    command: >
      postgres -c max_connections=100
               -c shared_buffers=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificationdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. pgbouncer-core: Connection Pooler en modo Transaction para Camino Crítico
  pgbouncer-core:
    image: edoburu/pgbouncer:latest
    container_name: fintech-pgbouncer-core
    ports:
      - "6432:6432"
    environment:
      LISTEN_PORT: 6432
      DB_HOST: postgres-core
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      ADMIN_USERS: postgres
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres-core:
        condition: service_healthy

  # 4. Herramienta DevOps de Respaldo Automatizado (Backup & DR)
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: fintech-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres-core:
        condition: service_healthy
      postgres-support:
        condition: service_healthy
    volumes:
      - ./backups:/backups:z
    environment:
      POSTGRES_HOST: postgres-core
      POSTGRES_DB: authdb,userdb,transactiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --no-owner --no-privileges"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_SUFFIX: ".sql.gz"

  # ==============================================================================
  # MENSAJERÍA, CACHÉ Y HERRAMIENTAS
  # ==============================================================================

  kafka:
    image: apache/kafka:3.7.0
    container_name: fintech-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  maildev:
    image: maildev/maildev:3.0.0-rc.1
    container_name: fintech-maildev
    ports:
      - "1080:1080"
      - "1025:1025"

  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # MICROSERVICIOS NESTJS
  # ==============================================================================

  auth-service:
    build:
      context: ./backend-nestjs/auth-service
      dockerfile: Containerfile
    container_name: fintech-auth
    ports:
      - "3001:3001"
      - "8081:3001"
    depends_on:
      postgres-core:
        condition: service_healthy
      pgbouncer-core:
        condition: service_started
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345}@pgbouncer-core:6432/authdb?schema=public&pgbouncer=true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_FROM: noreply@fintechwallet.com
      JWT_SECRET: ${JWT_SECRET:-dGhpc2lzYXNlY3JldGtleWZvcmp3dHRva2VudmFsaWRhdGlvbmZpbnRlYch3YWxsZXQ=}
      USER_SERVICE_URL: http://user-service:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: auth-service

  user-service:
    build:
      context: ./backend-nestjs/user-service
      dockerfile: Containerfile
    container_name: fintech-user
    ports:
      - "3002:3002"
      - "8082:3002"
      - "9090:9090"
    depends_on:
      postgres-core:
        condition: service_healthy
      pgbouncer-core:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345}@pgbouncer-core:6432/userdb?schema=public&pgbouncer=true
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: user-service

  transaction-service:
    build:
      context: ./backend-nestjs/transaction-service
      dockerfile: Containerfile
    container_name: fintech-transaction
    ports:
      - "3003:3003"
      - "8083:3003"
    depends_on:
      postgres-core:
        condition: service_healthy
      pgbouncer-core:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345}@pgbouncer-core:6432/transactiondb?schema=public&pgbouncer=true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:3002
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: transaction-service

  notification-service:
    build:
      context: ./backend-nestjs/notification-service
      dockerfile: Containerfile
    container_name: fintech-notification
    ports:
      - "3004:3004"
      - "8084:3004"
    depends_on:
      postgres-support:
        condition: service_healthy
      kafka:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345}@postgres-support:5432/notificationdb?schema=public
      KAFKA_BROKERS: kafka:29092
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_FROM: noreply@fintechwallet.com
      USER_SERVICE_URL: http://user-service:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: notification-service

  worker-service:
    build:
      context: ./backend-nestjs/worker-service
      dockerfile: Containerfile
    container_name: fintech-worker
    ports:
      - "3005:3005"
      - "8085:3005"
    depends_on:
      postgres-support:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "3005"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345}@postgres-support:5432/workerdb?schema=public
      KAFKA_BROKERS: kafka:29092
      STATEMENTS_DIR: /tmp/statements
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: worker-service

  # ==============================================================================
  # FRONTEND
  # ==============================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: fintech-frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - user-service
      - transaction-service
      - otel-collector

  # ==============================================================================
  # SIGNOZ OBSERVABILITY
  # ==============================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: fintech-clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro,z
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/experimental.xml:ro,z
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.7
    container_name: fintech-signoz-telemetrystore-migrator
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap --config /etc/otel-collector-config.yaml && \
        /signoz-otel-collector migrate sync up --config /etc/otel-collector-config.yaml && \
        /signoz-otel-collector migrate async up --config /etc/otel-collector-config.yaml
    volumes:
      - ./infra/otel/otel-migration-config.yaml:/etc/otel-collector-config.yaml:ro,z
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
    depends_on:
      clickhouse:
        condition: service_healthy

  signoz:
    image: signoz/signoz:v0.136.1
    container_name: fintech-signoz
    ports:
      - "3301:8080"
    environment:
      - STORAGE=clickhouse
      - ClickHouseUrl=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
    volumes:
      - signoz-sqlite:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.7
    container_name: fintech-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,z
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully

  signoz-mcp-server:
    image: signoz/signoz-mcp-server:v0.11.0
    container_name: fintech-signoz-mcp-server
    ports:
      - "8000:8000"
    environment:
      - TRANSPORT_MODE=http
      - MCP_SERVER_PORT=8000
      - SIGNOZ_URL=http://signoz:8080
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
    depends_on:
      - signoz

volumes:
  postgres-core-data:
  postgres-support-data:
  clickhouse-data:
  signoz-sqlite:
  redis-data:
