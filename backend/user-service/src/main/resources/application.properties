spring.application.name=user-service
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# gRPC config
grpc.server.port=9090
grpc.server.permit-keep-alive-without-calls=${GRPC_SERVER_PERMIT_KEEP_ALIVE_WITHOUT_CALLS:true}
grpc.server.permit-keep-alive-time=${GRPC_SERVER_PERMIT_KEEP_ALIVE_TIME:10s}

# Springdoc properties
springdoc.api-docs.path=/users/v3/api-docs
