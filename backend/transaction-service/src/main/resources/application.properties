spring.application.name=transaction-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/transactiondb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

user.service.url=http://localhost:8082

# gRPC config
grpc.client.user-service.address=${GRPC_USER_SERVICE_ADDRESS:dns:///user-service:9090}
grpc.client.user-service.negotiation-type=plaintext
grpc.client.user-service.enable-retry=true
grpc.client.user-service.enable-keep-alive=true
grpc.client.user-service.keep-alive-time=30s
grpc.client.user-service.keep-alive-timeout=10s
grpc.client.user-service.keep-alive-without-calls=true

# Actuator config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Springdoc properties
springdoc.api-docs.path=/transactions/v3/api-docs
