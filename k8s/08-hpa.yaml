# ========================================================
# HORIZONTAL POD AUTOSCALERS (HPA) & POD DISRUPTION BUDGETS (PDB)
# ========================================================

# 1. API GATEWAY HPA & PDB
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: fintech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
