# ==============================================================================
# KIND CLUSTER CONFIGURATION - FINTECH WALLET
# Configuración optimizada para Podman y soporte de Ingress Traefik / Nginx
# ==============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fintech
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # HTTP Ingress (Frontend & APIs)
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  # HTTPS Ingress
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # SigNoz UI / Observability Dashboard
  - containerPort: 3301
    hostPort: 3301
    protocol: TCP
  # MailDev Web UI
  - containerPort: 1080
    hostPort: 1080
    protocol: TCP
  # OpenTelemetry Collector (OTLP gRPC)
  - containerPort: 4317
    hostPort: 4317
    protocol: TCP
  # OpenTelemetry Collector (OTLP HTTP)
  - containerPort: 4318
    hostPort: 4318
    protocol: TCP
