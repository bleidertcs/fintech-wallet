# ==============================================================================
# 02-MICROSERVICES.YAML - DESPLIEGUE DE LOS 5 MICROSERVICIOS NESTJS
# Incluye Deployments y ClusterIP Services para:
# 1. auth-service         (Autenticación JWT, BCrypt, 2FA/TOTP) - Puerto 3001
# 2. user-service         (Perfiles de Usuario, Saldos, tRPC Router) - Puerto 8082 -> 3002
# 3. transaction-service  (Transferencias, Idempotencia, CQRS, Outbox) - Puerto 8083 -> 3003
# 4. notification-service (Consumidor Kafka, Email Maildev, tRPC Client) - Puerto 8084 -> 3004
# 5. worker-service       (Extractos Bancarios PDFKit, DLQ Kafka) - Puerto 8085 -> 3005
#
# NOTA ARQUITECTÓNICA DE RECURSOS (Best Practices K8s / K3s):
# Se definen 'requests' (128Mi RAM / 100m CPU) para garantizar el agendamiento (Scheduler QoS).
# Se eliminan los 'limits.cpu' para evitar el CFS Bandwidth Throttling (congelamiento de hilos Node.js).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AUTH-SERVICE DEPLOYMENT & SERVICE
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fintech
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: fintech/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
            - name: UV_THREADPOOL_SIZE
              value: "8"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: "fintech-k8s-cluster"
            - name: DATABASE_URL
              value: "postgresql://postgres:12345@pgbouncer-core:6432/authdb?schema=public&pgbouncer=true"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_HOST
              value: "maildev"
            - name: MAIL_PORT
              value: "1025"
            - name: MAIL_FROM
              value: "noreply@fintechwallet.com"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: JWT_SECRET
            - name: USER_SERVICE_URL
              value: "http://user-service:8082"
            - name: APP_FRONTEND_URL
              value: "http://localhost"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.fintech.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: auth-service
---
