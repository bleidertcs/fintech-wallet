# ==============================================================================
# 10-PDB.YAML - POD DISRUPTION BUDGETS (PRESUPUESTO DE INTERRUPCIÓN DE PODS)
# Asegura disponibilidad constante durante actualizaciones y mantenimiento
# ==============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
