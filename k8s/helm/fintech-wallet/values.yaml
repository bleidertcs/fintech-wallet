global:
  storageClass: "local-path"
  environment: "production"
  dbUsername: "postgres"
  dbPassword: "12345"
  jwtSecret: "dGhpc2lzYXNlY3JldGtleWZvcmp3dHRva2VudmFsaWRhdGlvbmZpbnRlYch3YWxsZXQ="
  otelEndpoint: "http://otel-collector.{{ .Release.Namespace }}.svc.cluster.local:4318"
  otelCollectorGrpcHost: "otel-collector"
  clusterName: "fintech-k8s-cluster"

postgresCore:
  image: "postgres:16-alpine"
  storage: "5Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"

postgresSupport:
  image: "postgres:16-alpine"
  storage: "5Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"

pgbouncer:
  replicaCount: 1
  image: "edoburu/pgbouncer:v1.22.1"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"

redis:
  image: "redis:7-alpine"
  storage: "1Gi"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"

kafka:
  image: "apache/kafka:3.7.0"
  storage: "5Gi"
  resources:
    requests:
      memory: "384Mi"
      cpu: "150m"
    limits:
      memory: "768Mi"

maildev:
  replicaCount: 1
  image: "maildev/maildev:2.1.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"

frontend:
  replicaCount: 1
  image:
    repository: "bleiderc/fintech-wallet"
    tag: "frontend-1.0.0"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"

