apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz
  namespace: {{ .Release.Namespace }}
  labels:
    app: signoz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
  template:
    metadata:
      labels:
        app: signoz
    spec:
      containers:
        - name: signoz
          image: {{ .Values.observability.signoz.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: ui
          env:
            - name: STORAGE
              value: "clickhouse"
            - name: ClickHouseUrl
              value: "tcp://clickhouse:9000"
            - name: SIGNOZ_SQLSTORE_SQLITE_PATH
              value: "/tmp/signoz.db"
          resources:
            {{- toYaml .Values.observability.signoz.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: signoz
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30301
      name: ui
  selector:
    app: signoz
