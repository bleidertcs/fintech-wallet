apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: transaction-service
spec:
  replicas: {{ .Values.transactionService.replicaCount }}
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: "{{ .Values.transactionService.image.repository }}:{{ .Values.transactionService.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3003
              name: http
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size=200"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: {{ .Values.global.clusterName | quote }}
            - name: OTEL_SERVICE_NAME
              value: "transaction-service"
            - name: DATABASE_URL
              value: "mysql://{{ .Values.global.dbUsername }}:{{ .Values.global.dbPassword }}@mysql:3306/transactiondb?allowPublicKeyRetrieval=true"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: USER_SERVICE_GRPC_URL
              value: "user-service.{{ .Release.Namespace }}.svc.cluster.local:9090"
            - name: KAFKA_BROKERS
              value: "kafka:29092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ tpl .Values.global.otelEndpoint . | quote }}
          resources:
            {{- toYaml .Values.transactionService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 3003
      name: http
  selector:
    app: transaction-service
