# ==============================================================================
# INGRESS.YAML - TRAEFIK MIDDLEWARES, INGRESSES & INGRESSROUTES
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefixRegex:
    regex:
      - "^/api"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-maildev-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefixRegex:
    regex:
      - "^/maildev"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
  namespace: {{ .Release.Namespace }}
spec:
  rateLimit:
    average: 100
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-otlp-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefixRegex:
    regex:
      - "^/otlp"
---
# ------------------------------------------------------------------------------
# INGRESS: OTLP Web Tracing Browser
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otlp-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-otlp-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /otlp
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                port:
                  number: 4318
---
# ------------------------------------------------------------------------------
# INGRESSES: Swagger Docs por Microservicio
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
