# ------------------------------------------------------------------------------
# INGRESS PRINCIPAL: Frontend SPA y Router de APIs (/api/*)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintech-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8082
          - path: /api/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8083
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8084
          - path: /api/worker
            pathType: Prefix
            backend:
              service:
                name: worker-service
                port:
                  number: 8085
---
# ------------------------------------------------------------------------------
# INGRESS: MailDev Web UI en ruta /maildev
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maildev-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: maildev.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maildev
                port:
                  number: 1080
    - host: mail.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maildev
                port:
                  number: 1080
    - http:
        paths:
          - path: /maildev
            pathType: Prefix
            backend:
              service:
                name: maildev
                port:
                  number: 1080
---
# ------------------------------------------------------------------------------
# INGRESS: SigNoz en VirtualHost signoz.localhost
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: signoz.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signoz
                port:
                  number: 8080
---
# ------------------------------------------------------------------------------
# INGRESSROUTES: Enrutamiento Dedicado para SigNoz (:3301) y MailDev (:1080)
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: signoz-web
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - signoz
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: signoz
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maildev-web
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - maildev
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: maildev
          port: 1080
