apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker-service
spec:
  replicas: {{ .Values.workerService.replicaCount }}
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          image: "{{ .Values.workerService.image.repository }}:{{ .Values.workerService.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size=200"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: {{ .Values.global.clusterName | quote }}
            - name: OTEL_SERVICE_NAME
              value: "worker-service"
            - name: DATABASE_URL
              value: "mysql://{{ .Values.global.dbUsername }}:{{ .Values.global.dbPassword }}@mysql:3306/workerdb?allowPublicKeyRetrieval=true"
            - name: KAFKA_BROKERS
              value: "kafka:29092"
            - name: STATEMENTS_DIR
              value: "/tmp/statements"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ tpl .Values.global.otelEndpoint . | quote }}
          resources:
            {{- toYaml .Values.workerService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 3005
      name: http
  selector:
    app: worker-service
