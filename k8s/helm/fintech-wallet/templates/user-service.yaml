apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
spec:
  replicas: {{ .Values.userService.replicaCount }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3002
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: PORT
              value: "3002"
            - name: GRPC_PORT
              value: "50051"
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size=200"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: {{ .Values.global.clusterName | quote }}
            - name: OTEL_SERVICE_NAME
              value: "user-service"
            - name: DATABASE_URL
              value: "mysql://{{ .Values.global.dbUsername }}:{{ .Values.global.dbPassword }}@mysql:3306/userdb?allowPublicKeyRetrieval=true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ tpl .Values.global.otelEndpoint . | quote }}
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 3002
      name: http
    - port: 9090
      targetPort: 50051
      name: grpc
  selector:
    app: user-service
