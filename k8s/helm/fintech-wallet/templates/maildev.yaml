apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: {{ .Release.Namespace }}
  labels:
    app: maildev
spec:
  replicas: {{ .Values.maildev.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
        - name: maildev
          image: {{ .Values.maildev.image | quote }}
          args:
            - "--base-pathname"
            - "/maildev"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 1080
              name: web
            - containerPort: 1025
              name: smtp
          resources:
            {{- toYaml .Values.maildev.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /maildev
              port: 1080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /maildev
              port: 1080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - port: 1080
      targetPort: 1080
      nodePort: 30080
      name: web
    - port: 1025
      targetPort: 1025
      name: smtp
  selector:
    app: maildev
