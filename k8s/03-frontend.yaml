# ==============================================================================
# 03-FRONTEND.YAML - DESPLIEGUE DEL FRONTEND WEB REACT (VITE + NGINX)
# Contenedor servidor de la aplicación Single Page Application (SPA) en React
#
# NOTA ARQUITECTÓNICA DE RECURSOS:
# Se define 'requests' liviano (64Mi RAM / 50m CPU) y se omiten límites restrictivos.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DEPLOYMENT: frontend
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fintech
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fintech/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ------------------------------------------------------------------------------
# 2. SERVICIO KUBERNETES: frontend (NodePort 30000)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fintech
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
      name: http
  selector:
    app: frontend
