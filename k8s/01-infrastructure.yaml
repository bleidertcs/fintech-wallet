# ==============================================================================
# 01-INFRASTRUCTURE.YAML - INFRAESTRUCTURA CON ESTADO (STATEFULSETS) Y SERVICIOS
# Despliega PostgreSQL 16 (postgres-core y postgres-support), Redis 7, Apache Kafka (KRaft) y Maildev en Kubernetes.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. STATEFULSET: postgres-core (Camino Crítico: authdb, userdb, transactiondb)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: fintech
  labels:
    app: postgres-core
spec:
  serviceName: postgres-core
  replicas: 1
  selector:
    matchLabels:
      app: postgres-core
  template:
    metadata:
      labels:
        app: postgres-core
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "-c"
            - "max_connections=150"
            - "-c"
            - "shared_buffers=128MB"
            - "-c"
            - "work_mem=8MB"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "authdb"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "authdb"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "authdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-core-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-core-init-volume
              mountPath: /docker-entrypoint-initdb.d/init-core.sql
              subPath: init-core.sql
      volumes:
        - name: postgres-core-init-volume
          configMap:
            name: postgres-core-init-sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-core-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi
---
# SERVICIO KUBERNETES: postgres-core
apiVersion: v1
kind: Service
metadata:
  name: postgres-core
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-core
---
# ------------------------------------------------------------------------------
# 1.2. DEPLOYMENT & SERVICE: pgbouncer-core (Connection Pooler en modo Transaction)
# Multiplexa conexiones para auth-service, user-service y transaction-service
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-core
  namespace: fintech
  labels:
    app: pgbouncer-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer-core
  template:
    metadata:
      labels:
        app: pgbouncer-core
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            - name: LISTEN_PORT
              value: "6432"
            - name: DB_HOST
              value: "postgres-core"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_PASSWORD
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: ADMIN_USERS
              value: "postgres"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits,options"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-core
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer-core
---
# ------------------------------------------------------------------------------
# 1.1. STATEFULSET: postgres-support (Servicios de Soporte: notificationdb, workerdb)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-support
  namespace: fintech
  labels:
    app: postgres-support
spec:
  serviceName: postgres-support
  replicas: 1
  selector:
    matchLabels:
      app: postgres-support
  template:
    metadata:
      labels:
        app: postgres-support
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "-c"
            - "max_connections=100"
            - "-c"
            - "shared_buffers=64MB"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "notificationdb"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notificationdb"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notificationdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-support-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-support-init-volume
              mountPath: /docker-entrypoint-initdb.d/init-support.sql
              subPath: init-support.sql
      volumes:
        - name: postgres-support-init-volume
          configMap:
            name: postgres-support-init-sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-support-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi
---
# SERVICIO KUBERNETES: postgres-support
apiVersion: v1
kind: Service
metadata:
  name: postgres-support
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-support
---
# ------------------------------------------------------------------------------
# 2. STATEFULSET: Redis 7 (Caché en Memoria e Idempotencia)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: fintech
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "redis-server"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "volatile-lru"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 1Gi
---
# SERVICIO KUBERNETES: redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
---
# ------------------------------------------------------------------------------
# 3. STATEFULSET: Apache Kafka 3.7.0 (Modo KRaft)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fintech
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 29092
              name: internal
            - containerPort: 9092
              name: external
            - containerPort: 29093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
          startupProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kafka-logs
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi
---
# SERVICIO KUBERNETES: kafka
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 29092
      targetPort: 29092
      name: internal
    - port: 9092
      targetPort: 9092
      name: external
    - port: 29093
      targetPort: 29093
      name: controller
  selector:
    app: kafka
---
# ------------------------------------------------------------------------------
# 4. DEPLOYMENT: Maildev (Servidor SMTP de pruebas de envío de correos)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: fintech
  labels:
    app: maildev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
        - name: maildev
          image: maildev/maildev:2.1.0
          args:
            - "--base-pathname"
            - "/maildev"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 1080
              name: web
            - containerPort: 1025
              name: smtp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /maildev
              port: 1080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /maildev
              port: 1080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
# SERVICIO KUBERNETES: maildev (NodePort 30080)
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: fintech
spec:
  type: NodePort
  ports:
    - port: 1080
      targetPort: 1080
      nodePort: 30080
      name: web
    - port: 1025
      targetPort: 1025
      name: smtp
  selector:
    app: maildev
