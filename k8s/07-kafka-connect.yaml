apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: fintech
  labels:
    app: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
        - name: kafka-connect
          image: debezium/connect:2.5
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: GROUP_ID
              value: "debezium-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium_status"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: fintech
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: kafka-connect
---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-outbox-connector-init
  namespace: fintech
spec:
  template:
    spec:
      containers:
        - name: init-connector
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              until curl -s -f http://kafka-connect:8083/; do
                echo "Waiting for Kafka Connect to be ready..."
                sleep 5
              done
              echo "Registering Debezium Outbox Connector for tx-mysql..."
              curl -X POST -H "Content-Type: application/json" --data '{
                "name": "outbox-connector",
                "config": {
                  "connector.class": "io.debezium.connector.mysql.MySqlConnector",
                  "tasks.max": "1",
                  "database.hostname": "tx-mysql",
                  "database.port": "3306",
                  "database.user": "tx_user",
                  "database.password": "tx_password_123",
                  "database.server.id": "184054",
                  "topic.prefix": "fintech",
                  "schema.history.internal.kafka.bootstrap.servers": "kafka:29092",
                  "schema.history.internal.kafka.topic": "schema-changes.transactiondb",
                  "table.include.list": "transactiondb.outbox_events",
                  "tombstones.on.delete": "false"
                }
              }' http://kafka-connect:8083/connectors
      restartPolicy: OnFailure
