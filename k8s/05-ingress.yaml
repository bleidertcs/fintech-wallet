# ==============================================================================
# 05-INGRESS.YAML - CONFIGURACIÓN DE TRAEFIK API GATEWAY & ROUTING
# Define los Middlewares (StripPrefix, RateLimiting), las reglas de Ingress HTTP
# para la API y la consola gráfica del Dashboard de Traefik.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MIDDLEWARE TRAEFIK: strip-api-prefix
# Remueve el prefijo '/api' de las peticiones entrantes antes de reenviarlas a los microservicios
# Ejemplo: GET /api/auth/login -> GET /auth/login en auth-service
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: fintech
spec:
  stripPrefixRegex:
    regex:
      - "^/api" # Expresión regular que remueve /api al inicio de la URL
---
# ------------------------------------------------------------------------------
# 2. MIDDLEWARE TRAEFIK: strip-maildev-prefix
# Remueve el prefijo '/maildev' para redirigir la interfaz gráfica al puerto 1080
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-maildev-prefix
  namespace: fintech
spec:
  stripPrefixRegex:
    regex:
      - "^/maildev"
---
# ------------------------------------------------------------------------------
# 3. MIDDLEWARE TRAEFIK: auth-ratelimit
# Control de flujo de tráfico (Rate Limiting) para prevenir ataques de fuerza bruta
# Permite un promedio de 100 req/s con ráfagas de hasta 50 solicitudes
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
  namespace: fintech
spec:
  rateLimit:
    average: 100 # Tasa promedio sostenida
    burst: 50    # Ráfaga máxima permitida
---
# ------------------------------------------------------------------------------
# 4. MIDDLEWARE TRAEFIK: strip-otlp-prefix
# Remueve el prefijo '/otlp' para llamadas de telemetría hacia otel-collector:4318
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-otlp-prefix
  namespace: fintech
spec:
  stripPrefixRegex:
    regex:
      - "^/otlp"
---
# ------------------------------------------------------------------------------
# 5. INGRESS OTLP: otlp-ingress (Browser Web Telemetry a OpenTelemetry Collector)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otlp-ingress
  namespace: fintech
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: fintech-strip-otlp-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /otlp
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                port:
                  number: 4318
---
# ------------------------------------------------------------------------------
# 6. INGRESS RECURSOS: Enrutamiento por servicio y Swagger Docs
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: fintech
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: fintech-auth-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik # Utiliza el Ingress Controller nativo Traefik de K3s
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
---
